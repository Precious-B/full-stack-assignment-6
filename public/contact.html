        <main class="contact_info">
            <section class="container">
                <h1 class="contact_intro">I'd like to hear from you!</h1>
                <p class="contact_paragraph"><em>Please use the contact form if you have any <br> inquiries or if you want to say hi.</em></p>
                <div class="links">

            <section class="container2">
        <h1 class="contact_title">Contact Me</h1>
        <div class="contact_form">
            <form action="#" method="POST">
                <div class="form_info">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form_info">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form_info">
                    <label for="subject">Subject</label>
                    <input type="subject" id="subject" name="subject" required>
                </div>
                <div class="form_info">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
